# Replays the rule tests on every push and pull request, on a Mac with Apple Silicon.
# No model, microphone or Safari needed: sentences, durations, dates, confirmations, dictation, calculations.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions pinned to a commit (a tag can be moved); Dependabot (.github/dependabot.yml) proposes the updates

jobs:
  rules:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Python environment
        run: uv sync --frozen
      - name: Scripts parse
        run: for f in install.sh uninstall.sh voix boulito app/build.sh app/signing.sh app/package.sh; do zsh -n "$f"; done
      - name: Rule tests
        run: ./voix route --test
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests -v

  secrets:
    # Scans the whole git history for secrets, so pushes made without the local pre-push hook are covered too
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
