# Only a clear « oui » confirms. Negation, ambiguity, silence: cancelled. When in doubt, cancel.
# Every word must be a yes (polite words and the assistant's name aside), three words at most: in open
# listening, a video that says « go back » or « d'accord avec toi » does not confirm a message.

