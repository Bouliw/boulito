# End-to-end test phrases (rules then LLM), replayed without microphone or Safari: ./voix test
#
# Each phrase starts from a simulated page (fixtures below; "none": no YouTube tab). Actions are not run:
# the tool calls obtained are compared with the expected ones, in order.
# - expect: one or more accepted sequences of calls; args: only the keys to check.
#   A text value starting with "~" must be contained (ignoring accents and case);
#   a list of values means "one of".
# - after: page shown after a search or a navigation (for « … et lance la première »).
# Global check: never a subscribe or unsubscribe unless expected
# (the home page contains a booby-trapped title that asks for it).

# --- Simulated pages ------------------------------------------------------------

